name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release

      - name: Package release archive
        run: tar czf pike-linux-x86_64.tar.gz -C target/release pike -C "$GITHUB_WORKSPACE" LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: pike-linux-x86_64
          path: pike-linux-x86_64.tar.gz

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pike-linux-x86_64

      - uses: softprops/action-gh-release@v2
        with:
          files: pike-linux-x86_64.tar.gz
          generate_release_notes: true
