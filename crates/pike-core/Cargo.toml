[package]
name = "pike-core"
version = "0.2.1"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"
rusqlite = { version = "0.38", features = ["bundled"] }
thiserror = "2"
tracing = "0.1"
dirs = "6"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
