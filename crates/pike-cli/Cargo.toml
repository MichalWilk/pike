[package]
name = "pike-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pike"
path = "src/main.rs"

[dependencies]
pike-core = { path = "../pike-core" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-i18n = "3"
sys-locale = "0.3"
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"
chrono = "0.4"
