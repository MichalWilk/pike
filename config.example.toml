# Pike configuration
# All values shown below are defaults. Uncomment to override.

[general]
# Privilege escalation method for system package operations (dnf/apt install/remove/update)
# "auto" = sudo when TTY available, pkexec (GUI prompt) otherwise
# "sudo" / "doas" = always use terminal prompt (fails without TTY)
# "pkexec" = always use polkit GUI dialog
# privilege_escalation = "auto"

[sources]
# dnf = true
# flatpak = true
# apt = true

[display]
# Language: "auto" (detect from system), "en", or "pl"
# language = "auto"
# Ask for confirmation in the TUI before install, remove, clean and repo changes
# confirm_actions = true

# Architecture filters per source.
# Only packages matching these architectures are shown in search results.
# Defaults are auto-detected from host architecture.
# flatpak does not support arch filtering.
[display.architectures]
# Available: x86_64, aarch64, i686, noarch, armv7hl, ppc64le, s390x
# dnf = ["x86_64", "noarch"]

[logging]
# file = true

[daemon]
# Check interval in seconds (minimum: 10)
# interval = 600
# Show desktop notifications when updates are found
# notify = true

[cleanup]
# Number of newest kernels to keep (the running kernel is always kept)
# keep_kernels = 2
